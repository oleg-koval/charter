[package]
name = "charter-cli"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Enforces a code contract written as data: every rule is covered by a check, a review or a PR section, and a rule with no enforcement is an error."
license = "MIT"
repository = "https://github.com/oleg-koval/charter"
publish = false

[[bin]]
name = "charter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"

# Each lint below enforces a rule from .charter/rules.toml; the id is in the comment.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
as_conversions = "deny"          # C2 no casts
unwrap_used = "deny"             # C2 no non-null assertion
expect_used = "deny"             # C2
panic = "deny"                   # C9 failures are values the edge handles, not panics
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"       # C23 max 3 levels, threshold in clippy.toml
too_many_lines = "warn"          # C23 25 lines is a smell: exceed it only with #[expect(.., reason)]
allow_attributes = "deny"        # exceptions use #[expect], which fails once it is stale
allow_attributes_without_reason = "deny"  # every exception states why
