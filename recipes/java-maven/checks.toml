# Run from the project root after installing Maven and resolving dependencies.
[[check]]
id = "maven-tests"
rules = ["C7"]
run = "mvn test"
output = "exit"

# Pending obligations, not effective enforcement or waivers.
[[check]]
id = "configure-enforcement"
rules = ["C1", "C2", "C3", "C4", "C5", "C10", "C23"]
run = "echo 'Configure project source and secret checks in checks.toml for C1 C2 C3 C4 C5 C10 C23; see recipes/java-maven/README.md in the recipe source.' >&2; exit 1"
output = "exit"

